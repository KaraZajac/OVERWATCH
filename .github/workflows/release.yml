name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' is load-bearing. The action's default is
      # "tools platform-tools", but Google has removed the obsolete `tools`
      # package from the SDK repository, so sdkmanager exits 1 with
      # "Failed to find package 'tools'" (broke 2026-09-17). Nothing needs
      # installing here anyway — AGP downloads the platform and build-tools
      # it wants, and this step's job is just to provide sdkmanager and
      # accept licenses. Pinned to v3: v4 also insists on downloading its own
      # cmdline-tools and then fails license auto-accept.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/OVERWATCH-${GITHUB_REF_NAME}.apk"

      # Uploaded on every run (incl. workflow_dispatch) so a build can be
      # validated without cutting a release.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: overwatch-apk
          path: out/*.apk

      # Only tag pushes (v*) create a GitHub Release with the APK attached.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          generate_release_notes: true
